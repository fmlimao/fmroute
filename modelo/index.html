<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FM Route 2.0 — Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      padding: 2rem 0;
    }

    pre {
      margin: 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="d-flex align-items-baseline justify-content-between mb-4">
      <h1 class="mb-0">FM Route <span class="badge text-bg-primary">2.0</span></h1>
      <span class="text-muted">Acessos: <b id="accessCount">0</b></span>
    </div>

    <div class="row g-4">
      <div class="col-12 col-sm-4 col-md-3">
        <div class="list-group" id="menu">
          <a href="#/" class="list-group-item list-group-item-action" data-page="homepage">Página Inicial</a>
          <a href="#/page-1" class="list-group-item list-group-item-action" data-page="page1">Página 1</a>
          <a href="#/page-2/id-de-teste" class="list-group-item list-group-item-action" data-page="page2">Página 2 com
            parâmetro</a>
          <a href="#/redirect" class="list-group-item list-group-item-action" data-page="redirect">Redirect (2s)</a>
          <a href="#/pagina-falsa" class="list-group-item list-group-item-action text-danger">Página Falsa (404)</a>
        </div>
      </div>

      <div class="col-12 col-sm-8 col-md-9">
        <h2 class="border-bottom pb-2" id="pageTitle">…</h2>

        <div class="card mb-3">
          <div class="card-header">Variáveis da rota (<code>vars</code>)</div>
          <div class="card-body">
            <pre id="varsBox">{}</pre>
          </div>
        </div>

        <div class="card">
          <div class="card-header">Código desta rota</div>
          <div class="card-body">
            <pre id="codeBox"></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../fmroute.js"></script>
  <script>
    (function () {
      'use strict';

      var titleEl = document.getElementById('pageTitle');
      var varsEl = document.getElementById('varsBox');
      var codeEl = document.getElementById('codeBox');
      var countEl = document.getElementById('accessCount');
      var menu = document.getElementById('menu');

      var accessCount = 0;

      // Atualiza a UI para a página atual.
      function render(page, title, vars, code) {
        titleEl.textContent = title;
        varsEl.textContent = JSON.stringify(vars, null, 2);
        codeEl.textContent = code.trim();

        var links = menu.querySelectorAll('.list-group-item');
        for (var i = 0; i < links.length; i++) {
          links[i].classList.toggle('active', links[i].getAttribute('data-page') === page);
        }
      }

      // Troque para { mode: 'history' } e sirva via servidor HTTP para
      // navegar com URLs limpas (ex.: /page-1) em vez de hash.
      var route = new FMRoute({ mode: 'hash' });

      route.before(function (vars, next) {
        accessCount++;
        countEl.textContent = accessCount;
        next();
      });

      route.get('/', function (vars, next) {
        render('homepage', 'Página Inicial', vars,
          "route.get('/', function (vars, next) {\n  // sua lógica aqui\n  next();\n});");
        next();
      });

      route.get('/page-1', function (vars, next) {
        render('page1', 'Página 1', vars,
          "route.get('/page-1', function (vars, next) {\n  // sua lógica aqui\n  next();\n});");
        next();
      });

      route.get('/page-2/:id', function (vars, next) {
        render('page2', 'Página 2', vars,
          "route.get('/page-2/:id', function (vars, next) {\n  console.log(vars.id);\n  next();\n});");
        next();
      });

      route.get('/redirect', function (vars, next) {
        render('redirect', 'Redirect', vars,
          "route.get('/redirect', function (vars, next) {\n  setTimeout(function () {\n    route.go('/page-1');\n  }, 2000);\n  next();\n});");
        setTimeout(function () {
          route.go('/page-1');
        }, 2000);
        next();
      });

      route.error('404', function (vars, next) {
        render('', 'Página não encontrada (404)', vars,
          "route.error('404', function (vars, next) {\n  // página inexistente\n  next();\n});");
        next();
      });

      route.after(function (vars, current) {
        console.log('Rota executada:', current);
      });

      route.run();
    })();
  </script>
</body>

</html>
